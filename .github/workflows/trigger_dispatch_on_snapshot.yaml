---
# FEATURE_NAME: build_and_dispatch_docker_images
# FEATURE_VERSION: build_and_dispatch_docker_images-v5
# FEATURE_URL: https://github.com/prefapp/features/tree/build_and_dispatch_docker_images-v5/packages/build_and_dispatch_docker_images
# FEATURE_GIT_SHA: "2c3081793137d8cde377436057466e38cb4190bc"
# FEATURE_GIT_TAGS: ["build_and_dispatch_docker_images-v5.6.1","build_and_dispatch_docker_images-v5"]

name: Trigger dispatches on snapshot
run-name: Trigger dispatches on new snapshots built at "${{ github.event.workflow_run.head_sha }}"

on:
  workflow_run:
    workflows: ["Build Docker snapshots"]
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  on-success:
    runs-on: "ubuntu-24.04"
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check if dispatch should proceed
        id: check_autodeploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EVENT="${{ github.event.workflow_run.event }}"
          if [[ "$EVENT" != "workflow_dispatch" ]]; then
            echo "should_dispatch=true" >> "$GITHUB_OUTPUT"
          else
            CHECK_JOB_ID=$(gh api "/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs" --jq '.jobs[] | select(.name == "check-commits") | .id' 2>&1) || {
              echo "::warning::Failed to resolve check-commits job id: $CHECK_JOB_ID"
              echo "should_dispatch=false" >> "$GITHUB_OUTPUT"
              exit 0
            }

            if [[ -z "$CHECK_JOB_ID" ]]; then
              echo "::warning::Could not find check-commits job in triggering run; skipping auto dispatch"
              echo "should_dispatch=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            CHECK_JOB_LOG=$(gh run view "${{ github.event.workflow_run.id }}" --repo "${{ github.repository }}" --job "$CHECK_JOB_ID" --log 2>&1) || {
              echo "::warning::Failed to read triggering check-commits logs: $CHECK_JOB_LOG"
              echo "should_dispatch=false" >> "$GITHUB_OUTPUT"
              exit 0
            }

            if grep -Eq 'autodeploy:\s*true' <<< "$CHECK_JOB_LOG"; then
              echo "Detected autodeploy=true in triggering workflow logs"
              echo "should_dispatch=true" >> "$GITHUB_OUTPUT"

              FROM=$(grep -m1 -Eo 'from:[[:space:]]+[^[:space:]"]+' <<< "$CHECK_JOB_LOG" | sed 's/from:[[:space:]]*//' || true)
              if [[ -n "$FROM" ]]; then
                RESOLVED_SHA=$(gh api "/repos/${{ github.repository }}/commits/$FROM" --jq '.sha' 2>/dev/null || true)
                if [[ -n "$RESOLVED_SHA" ]]; then
                  echo "Resolved 'from' input ($FROM) to SHA: ${RESOLVED_SHA:0:7}"
                  echo "built_sha=${RESOLVED_SHA:0:7}" >> "$GITHUB_OUTPUT"
                else
                  echo "::warning::Could not resolve 'from' ($FROM) to a SHA; falling back to head_sha"
                fi
              fi
            else
              echo "::notice::Autodeploy input was not true in triggering workflow"
              echo "should_dispatch=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Calculate short SHA
        if: ${{ steps.check_autodeploy.outputs.should_dispatch == 'true' }}
        id: calculate_sha
        run: |
          BUILT_SHA="${{ steps.check_autodeploy.outputs.built_sha }}"
          if [[ -n "$BUILT_SHA" ]]; then
            SHA_SHORT="$BUILT_SHA"
          else
            SHA_SHORT=$(cut -c 1-7 <<< '${{ github.event.workflow_run.head_sha }}')
          fi
          echo "sha_short=$SHA_SHORT" >> "$GITHUB_OUTPUT"

      - name: Dispatch image changes to state repos
        if: ${{ steps.check_autodeploy.outputs.should_dispatch == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo 'The triggering workflow passed'
          gh workflow run make_dispatches.yaml -R ${{ github.repository }} \
          -f image_type=snapshots \
          -f flavors='*' \
          -f overwrite_version=${{ steps.calculate_sha.outputs.sha_short }} \
          -f filter_by_env="dev" \
          -f workflow_run_id="${{ github.event.workflow_run.id }}"
