---
# FEATURE_NAME: build_and_dispatch_docker_images
# FEATURE_VERSION: build_and_dispatch_docker_images-v6
# FEATURE_URL: https://github.com/prefapp/features/tree/build_and_dispatch_docker_images-v6/packages/build_and_dispatch_docker_images
# FEATURE_GIT_SHA: "2cf4c2292479e548ab620cf168bbe11567cc62fb"
# FEATURE_GIT_TAGS: ["build_and_dispatch_docker_images-v6.0.0","build_and_dispatch_docker_images-v6"]

name: Trigger dispatches on snapshot
run-name: Trigger dispatches on new snapshots built at "${{ github.event.workflow_run.head_sha }}"

on:
  workflow_run:
    workflows: ["Build Docker snapshots"]
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  on-success:
    runs-on: "ubuntu-24.04"
    if: ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (
          github.event.workflow_run.event == 'push' ||
          github.event.workflow_run.event == 'workflow_dispatch' ||
          github.event.workflow_run.event == 'pull_request'
        )
      }}
    steps:
      - name: Check if dispatch should proceed
        id: check_autodeploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DEFAULT_BRANCH: 'main'
        run: |
          set -euo pipefail
          if [[ "$RUN_EVENT" == "workflow_dispatch" ]]; then
            CHECK_JOB_ID=$(gh api "/repos/$REPOSITORY/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.name == "check-commits") | .id' 2>&1) || {
              echo "::warning::Failed to resolve check-commits job id: $CHECK_JOB_ID"
              echo "should_dispatch=false" >> "$GITHUB_OUTPUT"
              exit 0
            }

            if [[ -z "$CHECK_JOB_ID" ]]; then
              echo "::warning::Could not find check-commits job in triggering run; skipping auto dispatch"
              echo "should_dispatch=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            CHECK_JOB_LOG=$(gh run view "$RUN_ID" --repo "$REPOSITORY" --job "$CHECK_JOB_ID" --log 2>&1) || {
              echo "::warning::Failed to read triggering check-commits logs: $CHECK_JOB_LOG"
              echo "should_dispatch=false" >> "$GITHUB_OUTPUT"
              exit 0
            }

            if grep -Eq 'autodeploy:\s*true' <<< "$CHECK_JOB_LOG"; then
              echo "Detected autodeploy=true in triggering workflow logs"
              echo "should_dispatch=true" >> "$GITHUB_OUTPUT"

              FROM=$(grep -m1 -Eo 'from:[[:space:]]+[^[:space:]"]+' <<< "$CHECK_JOB_LOG" | sed 's/from:[[:space:]]*//' || true)
              if [[ -n "$FROM" ]]; then
                RESOLVED_SHA=$(gh api "/repos/$REPOSITORY/commits/$FROM" --jq '.sha' 2>/dev/null || true)
                if [[ -n "$RESOLVED_SHA" ]]; then
                  echo "Resolved 'from' input ($FROM) to SHA: ${RESOLVED_SHA:0:7}"
                  echo "built_sha=${RESOLVED_SHA:0:7}" >> "$GITHUB_OUTPUT"
                else
                  echo "::warning::Could not resolve 'from' ($FROM) to a SHA; falling back to head_sha"
                fi
              fi
            else
              echo "::notice::Autodeploy input was not true in triggering workflow"
              echo "should_dispatch=false" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$RUN_EVENT" == "pull_request" ]]; then
            echo "::notice::Trusted same-repository pull request; relaying autodeploy label on the built image"
            echo "should_dispatch=true" >> "$GITHUB_OUTPUT"
          elif [[ "$RUN_EVENT" == "push" && "$RUN_HEAD_BRANCH" == "$DEFAULT_BRANCH" ]]; then
            echo "should_dispatch=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Ignoring '$RUN_EVENT' run of '$RUN_HEAD_BRANCH'"
            echo "should_dispatch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculate short SHA
        if: ${{ steps.check_autodeploy.outputs.should_dispatch == 'true' }}
        id: calculate_sha
        env:
          BUILT_SHA: ${{ steps.check_autodeploy.outputs.built_sha }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ -n "$BUILT_SHA" ]]; then
            SHA_SHORT="$BUILT_SHA"
          else
            SHA_SHORT=$(cut -c 1-7 <<< "$RUN_HEAD_SHA")
          fi
          echo "sha_short=$SHA_SHORT" >> "$GITHUB_OUTPUT"

      - name: Dispatch image changes to state repos
        if: ${{ steps.check_autodeploy.outputs.should_dispatch == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SHA_SHORT: ${{ steps.calculate_sha.outputs.sha_short }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          echo 'The triggering workflow passed'
          gh workflow run make_dispatches.yaml -R "$REPOSITORY" \
          -f image_type=snapshots \
          -f flavors='*' \
          -f overwrite_version="$SHA_SHORT" \
          -f filter_by_env="dev" \
          -f workflow_run_id="$RUN_ID"
