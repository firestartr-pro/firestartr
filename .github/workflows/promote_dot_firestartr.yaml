name: Promote dot-firestartr schemas
on:
  push:
    branches: [main]
    paths:
      [
        'packages/cdk8s_renderer/src/schemas/dot-firestartr/**',
        'packages/cdk8s_renderer/scripts/dot-firestartr-exporter.ts',
        '.github/workflows/promote_dot_firestartr.yaml',
      ]
  release:
    types: [released]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: promote-dot-firestartr
  cancel-in-progress: false
jobs:
  promote:
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          path: gitops
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.FIRESTARTER_DOCS_APP_ID }}
          private-key: ${{ secrets.FIRESTARTR_DOCS_APP_PEM_FILE }}
          owner: firestartr-pro
          repositories: docs
      - uses: actions/checkout@v7
        with:
          repository: firestartr-pro/docs
          ref: main
          path: pro-docs
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install npm and dependencies
        working-directory: gitops
        run: |
          npm install -g "$(node -p "require('./package.json').packageManager")"
          npm ci
      - name: Export schemas from TypeScript
        working-directory: gitops
        run: ./node_modules/.bin/tsx packages/cdk8s_renderer/scripts/dot-firestartr-exporter.ts > "$RUNNER_TEMP/dot-firestartr-schemas.json"
      - name: Promote schemas
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BRANCH_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          SCHEMAS_FILE: ${{ runner.temp }}/dot-firestartr-schemas.json
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          event = os.environ['EVENT_NAME']
          if event == 'release':
              tag = os.environ['RELEASE_TAG']
              if not re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?', tag):
                  raise ValueError('Invalid root release tag')
              targets = [tag]
              if '-' not in tag and os.environ.get('PRERELEASE') != 'true':
                  targets.append('latest')
          elif event == 'push':
              targets = ['main']
          elif event == 'workflow_dispatch':
              branch = os.environ['BRANCH_NAME']
              if not re.fullmatch(r'[A-Za-z0-9_-]+(?:[./][A-Za-z0-9_-]+)*', branch) or branch == 'latest' or re.fullmatch(r'v\d+\..*', branch):
                  raise ValueError('Unsafe or reserved branch path')
              targets = [branch]
          else:
              raise ValueError('Unsupported event')
          base = 'https://raw.githubusercontent.com/firestartr-pro/docs/refs/heads/main/site/raw/core/dot-firestartr'
          schemas = json.loads(pathlib.Path(os.environ['SCHEMAS_FILE']).read_text())
          for target in targets:
              destination = pathlib.Path('pro-docs/site/raw/core/dot-firestartr') / target
              destination.mkdir(parents=True, exist_ok=True)
              for name, source in schemas.items():
                  filename = f'{name}.schema.json'
                  schema = dict(source, **{'$id': f'{base}/{target}/{filename}'})
                  (destination / filename).write_text(json.dumps(schema, indent=2) + '\n')
          PY
      - name: Commit and push schemas
        working-directory: pro-docs
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$APP_SLUG[bot]@users.noreply.github.com"
          git add site/raw/core/dot-firestartr
          if ! git diff --staged --quiet; then
            git commit -m 'docs: promote dot-firestartr schemas'
            git push origin main
          fi
