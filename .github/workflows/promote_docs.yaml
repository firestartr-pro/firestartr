name: Promote Documentation to Docs Repo

on:
  push:
    branches:
      - main
    paths:
      - 'docs/public/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promote:
    name: Promote Documentation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: gitops

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.FIRESTARTER_DOCS_APP_ID }}
          private-key: ${{ secrets.FIRESTARTR_DOCS_APP_PEM_FILE }}
          owner: firestartr-pro
          repositories: docs

      - name: Checkout docs repo
        uses: actions/checkout@v7
        with:
          repository: firestartr-pro/docs
          path: pro-docs
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup environment variables
        run: |
          echo "PRO_DOCS_CORE_PATH=$GITHUB_WORKSPACE/pro-docs/site/raw/core" >> "$GITHUB_ENV"
          echo "PROMOTION_SUMMARY=$GITHUB_WORKSPACE/promotion-summary.md" >> "$GITHUB_ENV"

          # Initialize summary file
          cat > "$GITHUB_WORKSPACE/promotion-summary.md" << EOF
          # Documentation Promotion Summary

          **Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          ## Promoted Files

          EOF

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          cache: "npm"
          cache-dependency-path: "gitops/package-lock.json"

      - name: Install deps
        working-directory: gitops
        run: |
          npm ci

      - name: Promote public documentation
        working-directory: gitops
        env:
          SOURCE_PUBLIC_DOCS: ${{ github.workspace }}/gitops/docs/public
          DEST_REPO_ROOT: ${{ github.workspace }}/pro-docs
        run: bash .github/scripts/promote-public-docs.sh

      - name: Get GitHub App User ID
        id: get-user-id
        run: |
          USER_ID=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)
          echo "user-id=${USER_ID}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Commit and push changes to docs repo
        working-directory: pro-docs
        run: |
          set -e
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "" >> "$PROMOTION_SUMMARY"
            echo "ℹ️ **Status**: No changes to commit" >> "$PROMOTION_SUMMARY"
          else
            git commit -m "docs: update public documentation"
            git push origin main
            echo "" >> "$PROMOTION_SUMMARY"
            echo "✓ **Status**: Changes committed and pushed to firestartr-pro/docs" >> "$PROMOTION_SUMMARY"
          fi

      - name: Display final summary
        if: always()
        run: |
          echo "---"
          cat "$PROMOTION_SUMMARY"
          cat "$PROMOTION_SUMMARY" > "$GITHUB_STEP_SUMMARY"
