---
# FEATURE_NAME: build_and_dispatch_docker_images
# FEATURE_VERSION: build_and_dispatch_docker_images-v6
# FEATURE_URL: https://github.com/prefapp/features/tree/build_and_dispatch_docker_images-v6/packages/build_and_dispatch_docker_images
# FEATURE_GIT_SHA: "2cf4c2292479e548ab620cf168bbe11567cc62fb"
# FEATURE_GIT_TAGS: ["build_and_dispatch_docker_images-v6.0.0","build_and_dispatch_docker_images-v6"]

name: Make dispatches

permissions:
  id-token: write
  contents: read
  actions: read
  checks: read

on:
  workflow_dispatch:
    inputs:
      image_type:
        description: "[IMAGE TYPE] Filter dispatch by image type (releases, snapshots, *)"
        required: true
        type: choice
        options: ['releases', 'snapshots', '*']
        default: snapshots
      flavors:
        description: "[FLAVORS] Filter dispatches by image flavors, separated by comma (use '*' to target all flavors of the same image type)"
        required: false
        default: default
      overwrite_version:
        description: |
          [VERSION (overwrite)] Dispatch using this version instead of the one defined
          in the dispatches file (can be a short-sha, a release tag or any of the valid configuration keywords: $lastest_release, $latest_prerelease, $branch_<branch_name>...)
        required: false
        default: ''
      overwrite_tenant:
        description: |
          [TENANT (overwrite)] Dispatch using this tenant instead of using the one defined
          in the dispatches file, related to the flavor to deploy.
        required: false
        default: ''
      overwrite_env:
        description: |
          [ENV (overwrite)] Dispatch using this env instead of using the one defined in the
          dispatches file, related to the flavor to deploy.
        required: false
        default: ''
      filter_by_tenant:
        description: |
          [FILTER BY TENANT] Dispatch only to state repos whose tenant is included in this filter, if specified. Can be a comma separated list of tenants or * (all)
        required: true
        default: '*'
      filter_by_env:
        description: |
          [FILTER BY ENV] Dispatch only to state repos whose environment is included in this filter, if specified. Can be a comma separated list of environments or * (all)
        required: true
        default: '*'
      filter_by_platform:
        description: |
          [FILTER BY PLATFORM] Dispatch only to state repos whose platform is included in this filter, if specified. Can be a comma separated list of environments or * (all)
        required: true
        default: '*'
      workflow_run_id:
        description: Workflow run id from where we download de artifact

jobs:
  make-dispatches:
    runs-on: ubuntu-24.04
    steps:
      - name: Show user input
        env:
          IMAGE_TYPE: ${{ inputs.image_type }}
          FLAVORS: ${{ inputs.flavors }}
          OVERWRITE_VERSION: ${{ inputs.overwrite_version }}
          OVERWRITE_TENANT: ${{ inputs.overwrite_tenant }}
          OVERWRITE_ENV: ${{ inputs.overwrite_env }}
          FILTER_BY_TENANT: ${{ inputs.filter_by_tenant }}
          FILTER_BY_ENV: ${{ inputs.filter_by_env }}
          FILTER_BY_PLATFORM: ${{ inputs.filter_by_platform }}
          WORKFLOW_RUN_ID: ${{ inputs.workflow_run_id }}
        run: |
          echo "Image type: $IMAGE_TYPE"
          echo "Flavors: $FLAVORS"
          echo "Version overwrite: $OVERWRITE_VERSION"
          echo "Tenant overwrite: $OVERWRITE_TENANT"
          echo "Tenant filter: $FILTER_BY_TENANT"
          echo "Env overwrite: $OVERWRITE_ENV"
          echo "Env filter: $FILTER_BY_ENV"
          echo "Platform filter: $FILTER_BY_PLATFORM"
          echo "Workflow run ID: $WORKFLOW_RUN_ID"

      - name: 'Install Yaml Parser'
        run: npm install js-yaml@5.4.2

      - name: 'Verify source workflow run'
        uses: actions/github-script@v9
        if: ${{ inputs.workflow_run_id }}
        id: verify-source-run
        env:
          WORKFLOW_RUN_ID: ${{ inputs.workflow_run_id }}
          IMAGE_TYPE: ${{ inputs.image_type }}
        with:
          result-encoding: string
          script: |
            // Keyed by the immutable `path` the API reports for the run. The workflow
            // `run-name` is contributor-editable (a pull_request run executes the file
            // from the merge ref), so it must not be used to identify the producer.
            // `events` mirrors each producer's own `on:` block; `image_types` records what
            // that producer's images may legitimately be dispatched as (pre-releases
            // images dispatch as 'snapshots' scoped by filter_by_env, never as 'releases').
            const BUILD_WORKFLOWS = {
              '.github/workflows/build_docker_snapshots.yaml': {
                events: ['push', 'pull_request', 'workflow_dispatch'],
                image_types: ['snapshots', '*'],
              },
              '.github/workflows/build_docker_releases.yaml': {
                events: ['release', 'workflow_dispatch'],
                image_types: ['releases', '*'],
              },
              '.github/workflows/build_docker_pre-releases.yaml': {
                events: ['release', 'workflow_dispatch'],
                image_types: ['snapshots', '*'],
              },
            };

            const refuse = reason => core.setFailed(`Refusing untrusted build source: ${reason}`);
            const runId = Number(process.env.WORKFLOW_RUN_ID);
            const imageType = process.env.IMAGE_TYPE;

            if (!Number.isInteger(runId) || runId <= 0) {
              return refuse(`'${process.env.WORKFLOW_RUN_ID}' is not a valid workflow run id`);
            }

            core.info(`\u001b[43mVerifying source workflow run ${runId}`);
            const resp = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const run = resp.data;

            // Fork policy, enforced here because this step runs trusted default-branch
            // code. The producers' own guards are not a boundary: a `pull_request` run
            // evaluates the workflow from the merge ref, so a fork could delete them and
            // report success with a forged build summary artifact.
            const repoFullName = `${context.repo.owner}/${context.repo.repo}`;
            const headRepoFullName = run.head_repository?.full_name;
            if (headRepoFullName !== repoFullName) {
              return refuse(`run ${runId} head repository '${headRepoFullName ?? 'unknown'}' is not ${repoFullName}`);
            }

            const producer = Object.hasOwn(BUILD_WORKFLOWS, run.path) && BUILD_WORKFLOWS[run.path];
            if (!producer) {
              return refuse(`workflow '${run.name}' at '${run.path}' is not a build workflow`);
            }
            if (!producer.events.includes(run.event)) {
              return refuse(`event '${run.event}' is not valid for '${run.path}'`);
            }
            if (run.conclusion !== 'success') {
              return refuse(`run ${runId} concluded '${run.conclusion}', expected 'success'`);
            }
            if (!producer.image_types.includes(imageType)) {
              return refuse(`image_type '${imageType}' cannot be dispatched from '${run.path}'`);
            }

            core.info(`Verified '${run.name}' (${run.event}, ${run.head_branch}, ${run.conclusion})`);

            core.setOutput('producer', run.path);
            core.setOutput('producer_event', run.event);

            const actor = run.actor?.login ?? '';
            const triggeringActor = run.triggering_actor?.login;
            if (triggeringActor && triggeringActor != actor) return `${actor},${triggeringActor}`;
            return actor;

      - name: 'Download build images result from workflow run id'
        uses: actions/github-script@v9
        if: ${{ inputs.workflow_run_id }}
        id: download-build-summary
        env:
          WORKFLOW_RUN_ID: ${{ inputs.workflow_run_id }}
          SOURCE_WORKFLOW: ${{ steps.verify-source-run.outputs.producer }}
          SOURCE_RUN_EVENT: ${{ steps.verify-source-run.outputs.producer_event }}
        with:
          script: |
            const jsYaml = require("js-yaml")
            const { execFileSync } = require('child_process');
            const fs = require('fs');
            const os = require('os');
            const path = require('path');

            const runId = Number(process.env.WORKFLOW_RUN_ID);
            const sourceWorkflow = process.env.SOURCE_WORKFLOW;
            const sourceRunEvent = process.env.SOURCE_RUN_EVENT;

            if (!sourceWorkflow || !sourceRunEvent) {
              core.setFailed('Could not determine the source workflow run; refusing to dispatch');
              return;
            }

            core.info('\u001b[43mGetting workflow run artifacts');
            let allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: runId,
            });
            let matchArtifact = allArtifacts.data.artifacts.filter((artifact) => {
              return artifact.name == "build-images-results"
            })[0];

            if (!matchArtifact) {
              core.warning('No "build-images-results" artifact found — the build was likely skipped (e.g. all commits matched skip types or paths-ignore). Nothing to dispatch.');
              core.setOutput('skipped', 'true');
              return;
            }

            core.info('\u001b[38;5;6mDownloading artifact')
            let download = await github.rest.actions.downloadArtifact({
               owner: context.repo.owner,
               repo: context.repo.repo,
               artifact_id: matchArtifact.id,
               archive_format: 'zip',
            });

            const extractDir = fs.mkdtempSync(path.join(os.tmpdir(), 'build-images-results-'));
            const archivePath = path.join(extractDir, 'build-images-results.zip');

            fs.writeFileSync(archivePath, Buffer.from(download.data));
            core.info('\u001b[43mExtracting build_images_results.yaml from artifact...');
            execFileSync('unzip', ['-j', '-o', archivePath, 'build_images_results.yaml', '-d', extractDir]);
            core.info('\u001b[43mExtracted build_images_results.yaml');

            const summary = jsYaml.load(fs.readFileSync(path.join(extractDir, 'build_images_results.yaml'), 'utf8'));

            if (!Array.isArray(summary)) {
              core.setFailed('build_images_results.yaml does not contain a list of build results');
              return;
            }

            core.info(`Cross-checking ${summary.length} summary version(s) against releases`);
            const shortShaRe = /^[0-9a-f]{7}$/i;
            // Decided per entry from data the API attested (`run.event`) or the artifact
            // honestly declares (`entry.image_type`) — never from the caller's
            // `image_type` input, which would let a caller opt out of validation by
            // asking for '*'. Snapshot builds are commit-addressed and have no release
            // tag to check, so they are skipped by rule rather than by accident.
            const releaseRun = sourceRunEvent === 'release';
            for (const entry of summary) {
              // Always validate true releases; for pre-releases/snapshots only validate
              // if the version is not a short SHA (i.e., it was dereferenced to a tag)
              if (entry.image_type !== 'releases' && (!releaseRun || shortShaRe.test(entry.version))) {
                core.info(`Skipping release cross-check for ${entry.image_type} entry with version: ${entry.version}`);
                continue;
              }
              try {
                await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag: entry.version,
                });
              } catch {
                core.setFailed(`Build summary claims version '${entry.version}', which is not a release of ${context.payload.repository.full_name}`);
                return;
              }
            }

            return summary

      - name: Get Token from Github App
        id: get-gh-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.FS_STATE_APP_ID }}
          private-key: ${{ secrets.FS_STATE_PEM_FILE }}
          owner: ${{ github.repository_owner }}

      - name: 'Checkout .firestartr repository'
        uses: actions/checkout@v6
        with:
          repository: '${{ github.repository_owner }}/.firestartr'
          token: ${{ steps.get-gh-app-token.outputs.token }}
          path: .firestartr

      - name: 'Dispatch changes'
        if: ${{ steps.download-build-summary.outputs.skipped != 'true' }}
        uses: prefapp/action-make-state-repos-dispatches@v4
        env:
          LOG_LEVEL: 'debug'
        with:
          check_run_name: 'Firestartr Docker Images Summary'
          build_summary: ${{ steps.download-build-summary.outputs.result || '' }}
          dispatches_file: '.github/make_dispatches.yaml'
          apps_folder: '.firestartr/apps'
          platform_folder: '.firestartr/platforms'
          registries_folder: '.firestartr/docker_registries'
          token: ${{ steps.get-gh-app-token.outputs.token }}
          image_type: ${{ inputs.image_type }}
          flavors: ${{ inputs.flavors }}
          default_releases_registry: ${{ vars.DOCKER_REGISTRY_RELEASES }}
          default_snapshots_registry: ${{ vars.DOCKER_REGISTRY_SNAPSHOTS }}
          reviewers: ${{ steps.verify-source-run.outputs.result || github.actor }}
          overwrite_version: ${{ inputs.overwrite_version }}
          overwrite_tenant: ${{ inputs.overwrite_tenant }}
          overwrite_env: ${{ inputs.overwrite_env }}
          filter_by_tenant: ${{ inputs.filter_by_tenant }}
          filter_by_env: ${{ inputs.filter_by_env }}
          filter_by_platform: ${{ inputs.filter_by_platform }}
