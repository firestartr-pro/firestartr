name: Pr verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-in-sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Detect dependency manifest changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Outside pull requests there is nothing to diff against: always check.
          if [ -z "$BASE_SHA" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" HEAD -- package-lock.json ':(glob)**/package.json' | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No package.json or package-lock.json changes, skipping."
          fi

      - name: Setup node
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install npm
        if: steps.changes.outputs.changed == 'true'
        run: npm install -g npm@12.2.1

      - name: Make sure package-lock.json is in sync with the package.json files
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm install --package-lock-only --ignore-scripts
          if ! git diff --exit-code package-lock.json; then
            echo "::error file=package-lock.json::package-lock.json is out of sync with the package.json files. Run 'npm install --package-lock-only' and commit the result."
            exit 1
          fi

  lint-and-transpile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install npm
        run: npm install -g npm@12.2.1

      - name: Linter
        env:
          NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run lint

      - name: Transpile typescript files
        run: |
          NODE_OPTIONS="--max-old-space-size=4096" npm run build --workspace packages/cli
          NODE_OPTIONS="--max-old-space-size=4096" npm run build --workspace packages/fs-forge-cli
          npm run lint-fix --workspace packages/fs-forge-cli

      - name: Import CRDs with CDK8s
        working-directory: packages/cdk8s_renderer
        run: cat ../k8s/src/crds/*.yaml | ../../node_modules/.bin/cdk8s import /dev/stdin

      - name: Make sure CDK8s were updated if needed
        working-directory: packages/cdk8s_renderer
        run: |
          git diff --quiet --exit-code imports/firestartr.dev.ts

      - name: Make sure fs-forge-cli generated commands are up to date
        working-directory: packages/fs-forge-cli
        run: |
          git diff --quiet --exit-code src/commands/

  unit-tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        workspace:
          - cdk8s_renderer
          - cli
          - crs_analyzer
          - crs_status_service
          - features_preparer
          - features_renderer
          - github
          - importer
          - k8s
          - operator
          - gh_provisioner
          - scaffolder
          - terraform_provisioner
          - fs-forge-cli
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.sha }}

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          scope: "@firestartr"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install npm
        run: npm install -g npm@12.2.1

      - name: Install dependencies
        env:
          NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: ${{ matrix.workspace == 'gh_provisioner' }}
        with:
          tofu_version: "1.10"

      - name: Create symbolic link to terraform
        if: ${{ matrix.workspace == 'gh_provisioner' }}
        run: sudo ln -s $(which tofu) /usr/local/bin/terraform

      - name: Unit Tests
        env:
          ORG: firestartr-test
        run: npm run test --workspace packages/${{ matrix.workspace }}
