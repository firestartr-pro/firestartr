---
# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    # Dependabot reads the root package.json "packageManager" pin and commits the
    # lockfile with that npm. Workflows, images and the e2e container install the
    # same version from that field, so it is the only
    # place to edit. Never go below 11.5.1: publishing over OIDC needs it.
    directories:
      - "/"
    schedule:
      interval: "daily"
    versioning-strategy: increase
    open-pull-requests-limit: 30
    # Wait before proposing freshly published versions (supply chain risk:
    # malware is usually pulled within days). Security updates skip the
    # cooldown and are still opened immediately.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    # Dev dependencies use chore(deps), which release-please hides. Runtime and
    # critical bumps use fix(deps) so they release. The skill squash subject
    # follows levels.yaml and overrides this when they disagree.
    commit-message:
      prefix: fix
      prefix-development: chore
    # Every entry here is a deliberate hold with its reason next to it, and none
    # of them freezes the package: update-types only stops the major, so patches
    # and minors keep arriving and security updates always arrive. If the reason
    # stops being true, drop the line and let Dependabot open the PR.
    # Rationale and what lifts each hold: docs/adr/0007-dependency-update-policy.md
    ignore:
      # oclif moves as one set: @oclif/core 5 is a CLI rewrite, not a bump.
      - dependency-name: "@oclif/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@oclif/test"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@oclif/plugin-help"
        update-types: ["version-update:semver-major"]
      # v2 is a rewrite of the client. Five packages share it, so upgrade together.
      - dependency-name: "@kubernetes/client-node"
        update-types: ["version-update:semver-major"]
      # Majors must move with @octokit/rest (22 asks for ^14) and @octokit/core.
      - dependency-name: "@octokit/plugin-paginate-rest"
        update-types: ["version-update:semver-major"]
      # Types must match the Node version we support, not the newest release.
      # Bump together with engines, never on its own.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # ts-jest 29 only supports jest 29. Move the whole workspace to 30 first.
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@jest/globals"
        update-types: ["version-update:semver-major"]
