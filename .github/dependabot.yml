---
# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    # Dependabot routes every npm command through Corepack using the root
    # package.json "packageManager" pin, so it runs the same npm as CI and the
    # publish workflows. That pin must stay >= 11.5.1: publishing over OIDC
    # (trusted publishing) needs it. Bump it in a reviewed PR, never here.
    directories:
      - "/"
    schedule:
      interval: "daily"
    versioning-strategy: increase
    open-pull-requests-limit: 30
    # Ignore these dependencies to allow manual review of possible errors and conflicts
    ignore:
      - dependency-name: "uuid"
      - dependency-name: "@oclif/core"
      - dependency-name: "@kubernetes/client-node"
      - dependency-name: "@octokit/plugin-paginate-rest"
      - dependency-name: "@oclif/test"
      - dependency-name: "@oclif/plugin-help"
      - dependency-name: "@types/node"
      - dependency-name: "jest"
      - dependency-name: "@types/jest"
      - dependency-name: "@jest/globals"
      - dependency-name: "@octokit/request"
      - dependency-name: "@octokit/auth-app"
      - dependency-name: "@octokit/core"
      - dependency-name: "cron-parser"
