name: Feature request
description: Suggest an idea for this project.
title: "[`<scope>`]: "
labels: ["enhancement", "triage"]
type: enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature! Please replace `<scope>` in the
        title above with the value you pick in the **Scope** dropdown below.
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which component does this feature request relate to?
      options:
        - catalog_common
        - cdk8s_renderer
        - cli
        - crs_analyzer
        - crs_status_service
        - e2e
        - features_preparer
        - features_renderer
        - fs-forge-cli
        - gh_provisioner
        - operator
        - terraform_provisioner
        - other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem is.
      placeholder: Describe the problem or limitation you're running into.
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
    validations:
      required: false
