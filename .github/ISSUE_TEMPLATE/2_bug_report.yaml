name: Bug report
description: Create a report to help us improve
title: "[`<scope>`]: "
labels: ["bug", "triage"]
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please replace `<scope>` in the
        title above with the value you pick in the **Scope** dropdown below.
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which component does this bug relate to?
      options:
        - catalog_common
        - cdk8s_renderer
        - cli
        - crs_analyzer
        - crs_status_service
        - e2e
        - features_preparer
        - features_renderer
        - fs-forge-cli
        - gh_provisioner
        - operator
        - terraform_provisioner
        - other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: firestartr version
      description: Which version of firestartr are you running?
      placeholder: ex. 3.0.0
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the problem here.
    validations:
      required: false
