<!doctype html>
<!--
  Source of assets/architecture.png, the "How it works" diagram in the README.
  Edit this file, then re-render it with a headless Chrome or Chromium:

    chrome --headless --hide-scrollbars --force-device-scale-factor=1.5 \
      --window-size=1920,728 --default-background-color=00000000 \
      --virtual-time-budget=5000 \
      --screenshot=assets/architecture.png assets/architecture.html

  Fonts: the checked-in PNG was rendered on macOS, where the display font is
  Avenir. Other systems fall back to Nunito Sans, which loads from Google Fonts
  together with Roboto Mono, so rendering needs network access and text widths
  can differ slightly from the checked-in image.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Firestartr architecture</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;800&family=Roboto+Mono:wght@400;500;700&display=swap"
    />
    <style>
      :root {
        --text: #0a1830;
        --accent: #ff6b35;
        /* Orange for text on light cards: #ff6b35 is too light to read there. */
        --accent-ink: #b93a08;
        --teal: #087ea9;
        --slate: #25364a;
        --muted: #65758a;
        --display: Avenir, 'Avenir Next', 'Nunito Sans', system-ui, sans-serif;
        --mono: 'Roboto Mono', ui-monospace, Menlo, monospace;
      }

      html,
      body {
        margin: 0;
        background: transparent;
      }

      .canvas {
        position: relative;
        width: 1920px;
        height: 728px;
        overflow: hidden;
        border-radius: 36px;
        color: var(--text);
        font-family: var(--display);
        background:
          linear-gradient(90deg, rgba(10, 24, 48, 0.035) 1px, transparent 1px) 0 0 / 28px 28px,
          linear-gradient(0deg, rgba(10, 24, 48, 0.035) 1px, transparent 1px) 0 0 / 28px 28px,
          linear-gradient(90deg, rgba(255, 196, 150, 0.9) 0%, rgba(255, 226, 205, 0.55) 14%, rgba(255, 255, 255, 0) 38%),
          linear-gradient(270deg, rgba(170, 226, 255, 0.95) 0%, rgba(214, 240, 255, 0.55) 14%, rgba(255, 255, 255, 0) 36%),
          #f7f7fa;
      }

      .canvas > * {
        position: absolute;
        box-sizing: border-box;
      }

      .panel {
        top: 32px;
        height: 664px;
        background: rgba(255, 255, 255, 0.58);
        backdrop-filter: blur(28px) saturate(1.6);
        border: 1px solid rgba(255, 255, 255, 0.95);
        border-radius: 32px;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.9),
          0 2px 8px rgba(10, 24, 48, 0.05),
          0 32px 64px -28px rgba(10, 24, 48, 0.28);
      }

      .eyebrow {
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .pill {
        top: 60px;
        height: 44px;
        padding: 0 22px 0 18px;
        border-radius: 22px;
        display: flex;
        align-items: center;
        gap: 12px;
        white-space: nowrap;
        font-size: 17px;
        color: var(--slate);
        background: #ffffff;
        border: 1px solid rgba(10, 24, 48, 0.08);
        box-shadow:
          0 1px 2px rgba(10, 24, 48, 0.06),
          0 8px 18px -10px rgba(10, 24, 48, 0.25);
      }

      .pill::before {
        content: '';
        width: 10px;
        height: 10px;
        border-radius: 5px;
        background: var(--accent);
        box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.18);
      }

      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid #ffffff;
        box-shadow:
          0 2px 8px rgba(10, 24, 48, 0.05),
          0 28px 56px -26px rgba(10, 24, 48, 0.3);
      }

      .hub {
        background: linear-gradient(140deg, rgba(255, 243, 234, 0.9) 0%, rgba(255, 217, 187, 0.75) 100%);
        border: 2px solid rgba(255, 107, 53, 0.45);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.9),
          0 0 0 8px rgba(255, 107, 53, 0.08),
          0 32px 64px -28px rgba(255, 107, 53, 0.45);
      }

      .tile {
        width: 72px;
        height: 72px;
        margin-bottom: 14px;
        border-radius: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        border: 1px solid rgba(10, 24, 48, 0.08);
        box-shadow:
          0 1px 2px rgba(10, 24, 48, 0.06),
          0 8px 18px -10px rgba(10, 24, 48, 0.25);
      }

      .card .eyebrow {
        font-size: 15px;
        line-height: 1.3;
        white-space: nowrap;
      }

      .card .name {
        font-family: var(--mono);
        font-size: 27px;
        font-weight: 700;
        line-height: 1.25;
        white-space: nowrap;
      }

      .card .product {
        margin-top: 12px;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.01em;
        line-height: 1.2;
        white-space: nowrap;
      }

      .count {
        position: absolute;
        top: 14px;
        right: 14px;
        padding: 2px 10px;
        border-radius: 12px;
        background: rgba(10, 24, 48, 0.06);
        color: var(--slate);
        font-family: var(--mono);
        font-size: 15px;
        font-weight: 700;
      }

      .tag {
        height: 34px;
        padding: 0 16px;
        border-radius: 17px;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        white-space: nowrap;
        background: var(--accent);
        box-shadow: 0 6px 16px -6px rgba(255, 107, 53, 0.9);
        color: var(--text);
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.1em;
      }

      .takeaway {
        height: 68px;
        padding: 0 32px;
        border-radius: 34px;
        display: flex;
        align-items: center;
        white-space: nowrap;
        background: linear-gradient(120deg, #ff6b35 0%, #ff9360 100%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.35),
          0 24px 48px -22px rgba(255, 107, 53, 0.8);
        color: var(--text);
        font-size: 25px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }

      svg.wires {
        left: 0;
        top: 0;
        width: 1920px;
        height: 728px;
        fill: none;
        stroke-width: 3;
        stroke-linecap: round;
      }

      svg.wires circle {
        fill: #ffffff;
        stroke-width: 2.5;
      }

      .orange {
        stroke: var(--accent);
        color: var(--accent-ink);
      }

      .blue {
        stroke: var(--teal);
        color: var(--teal);
      }
    </style>
  </head>
