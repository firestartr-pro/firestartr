apiVersion: firestartr.dev/v1
kind: FirestartrGithubRepository
metadata:
  name: test-catalog
  annotations:
    firestartr.dev/external-name: test-catalog
    firestartr.dev/claim-ref: "ComponentClaim/test-catalog"
    backstage.io/techdocs-ref: url:https://github.com/firestartr-test/test-catalog/tree/main
spec:
  org: proba-non-sobreescribir
  firestartr:
    tfStateKey: 2113fe30-d113-4c66-b999-49581178ec5a
    technology:
      stack: csharp
      version: "12"
  repo:
    allowMergeCommit: true
    allowSquashMerge: true
    allowRebaseMerge: true
    allowAutoMerge: true
    deleteBranchOnMerge: true
    autoInit: true
    archiveOnDestroy: true
    allowUpdateBranch: true
    hasIssues: true
    visibility: private
    defaultBranch: main
    codeowners: |-
      # This file was generated by firestartr.
      # WARNING: Please don't edit this file directly in the repository
      # Go to gitops repository to modify it!
      *                        @firestartr-test/my-team
      *.js                     @firestartr-test/user-e
      *.c                      @firestartr-test/user-a @firestartr-test/user-e
      *.py                     @firestartr-test/user-a
  actions:
    oidc:
      useDefault: false
      includeClaimKeys:
        - patata
  permissions:
    - role: admin
      ref:
        kind: FirestartrGithubMembership
        name: user-a
        needsSecret: true
    - role: admin
      ref:
        kind: FirestartrGithubGroup
        name: firestartr-test-platform-team
        needsSecret: true
    - role: admin
      ref:
        kind: FirestartrGithubMembership
        name: user-i
        needsSecret: false
    - role: maintain
      ref:
        kind: FirestartrGithubMembership
        name: user_a
        needsSecret: false
  branchProtections:
    - branch: main
      statusChecks:
        - statuscheck1
        - statuscheck2
      requiredReviewersCount: 2
      requiredCodeownersReviewers: false
      enforceAdmins: true
      requireSignedCommits: true
      requireConversationResolution: false
  writeConnectionSecretToRef:
    name: FirestartrGithubRepository-test-catalog-outputs
    outputs:
      - key: id
      - key: nodeId
      - key: fullName
      - key: htmlUrl
      - key: sshCloneUrl
      - key: primaryLanguage
