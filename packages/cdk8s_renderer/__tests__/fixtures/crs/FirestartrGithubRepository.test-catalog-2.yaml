apiVersion: firestartr.dev/v1
kind: FirestartrGithubRepository
metadata:
  name: test-catalog-2
  annotations:
    firestartr.dev/external-name: test-catalog-2
    firestartr.dev/claim-ref: "ComponentClaim/test-catalog-2"
spec:
  context:
    backend:
      ref:
        kind: FirestartrProviderConfig
        name: firestartr-terraform-state
    provider:
      ref:
        kind: FirestartrProviderConfig
        name: github-app
  org: firestartr-test
  firestartr:
    tfStateKey: bafba657-e643-42a1-bcb9-b2d15e3ea0b7
    technology:
      stack: python
      version: "3.11"
  repo:
    allowMergeCommit: true
    allowSquashMerge: true
    allowRebaseMerge: true
    allowAutoMerge: true
    deleteBranchOnMerge: true
    autoInit: true
    archiveOnDestroy: true
    allowUpdateBranch: true
    hasIssues: true
    visibility: private
    defaultBranch: main
    codeowners: |-
      # This file was generated by firestartr.
      # WARNING: Please don't edit this file directly in the repository
      # Go to gitops repository to modify it!
      *                        @firestartr-test/my-team
  actions:
    oidc:
      useDefault: true
      includeClaimKeys: []
  permissions:
    - role: admin
      ref:
        kind: FirestartrGithubGroup
        name: my-team
        needsSecret: true
    - role: admin
      ref:
        kind: FirestartrGithubGroup
        name: firestartr-test-platform-team
        needsSecret: true
  branchProtections:
    - branch: main
      statusChecks:
        - statuscheck1
        - statuscheck2
      requiredReviewersCount: 2
      requiredCodeownersReviewers: false
      enforceAdmins: true
      requireSignedCommits: true
      requireConversationResolution: false
  writeConnectionSecretToRef:
    name: FirestartrGithubRepository-test-catalog-2-outputs
    outputs:
      - key: id
      - key: nodeId
      - key: fullName
      - key: htmlUrl
      - key: sshCloneUrl
      - key: primaryLanguage
