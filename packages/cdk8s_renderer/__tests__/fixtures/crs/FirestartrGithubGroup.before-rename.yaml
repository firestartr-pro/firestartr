apiVersion: firestartr.dev/v1
kind: FirestartrGithubGroup
metadata:
  name: before-rename
  annotations:
    firestartr.dev/external-name: before-rename
    firestartr.dev/claim-ref: "GroupClaim/before-rename"
spec:
  context:
    backend:
      ref:
        kind: FirestartrProviderConfig
        name: firestartr-terraform-state
    provider:
      ref:
        kind: FirestartrProviderConfig
        name: github-app
  description: Prefapp all description
  members: []
  org: 'test'
  privacy: 'private'
  firestartr:
    tfStateKey: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
  writeConnectionSecretToRef:
    name: firestartrgithubgroup-before-rename-outputs
    outputs:
      - key: id
      - key: nodeId
      - key: slug
