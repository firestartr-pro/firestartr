apiVersion: firestartr.dev/v1
kind: FirestartrGithubGroup
metadata:
  name: prefapp-all
  annotations:
    firestartr.dev/external-name: prefapp-all
    firestartr.dev/claim-ref: "GroupClaim/prefapp-all"
spec:
  context:
    backend:
      ref:
        kind: FirestartrProviderConfig
        name: firestartr-terraform-state
    provider:
      ref:
        kind: FirestartrProviderConfig
        name: github-app
  org: firestartr-test
  privacy: secret
  description: Prefapp all description
  members:
    - ref:
        kind: GroupClaim
        name: prefapp-devs
        needsSecret: false
    - ref:
        kind: UserClaim
        name: user-d
        needsSecret: false
  firestartr:
    tfStateKey: 102bbea5-269f-4852-9ecb-ccb2835f8999
  writeConnectionSecretToRef:
    name: FirestartrGithubGroup-prefapp-all-outputs
    outputs:
      - key: id
      - key: nodeId
      - key: slug
