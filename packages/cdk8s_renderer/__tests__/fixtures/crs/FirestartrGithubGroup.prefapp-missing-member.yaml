apiVersion: firestartr.dev/v1
kind: FirestartrGithubGroup
metadata:
  name: prefapp-missing-member
  annotations:
    firestartr.dev/external-name: prefapp-missing-member
    firestartr.dev/claim-ref: "GroupClaim/prefapp-missing-member"
spec:
  context:
    backend:
      ref:
        kind: FirestartrProviderConfig
        name: firestartr-terraform-state
    provider:
      ref:
        kind: FirestartrProviderConfig
        name: github-app
  org: firestartr-test
  privacy: secret
  description: Prefapp missing member description
  members:
    - ref:
        kind: UserClaim
        name: missing-member
        needsSecret: false
  firestartr:
    tfStateKey: c1850035-ddfc-414c-9bc2-ec3e0da4a35d
  writeConnectionSecretToRef:
    name: FirestartrGithubGroup-prefapp-missing-member-outputs
    outputs:
      - key: id
      - key: nodeId
      - key: slug
