name: branchStrategies
apiVersion: firestartr.dev/v1
kind: ComponentClaim
expanderValues:
  strategies:
    - name: trunkBasedDevelopment
      values:
        defaultBranch: main
        branchProtections:
          - branch: main
            statusChecks:
              - "statuscheck1"
              - "statuscheck2"
            requiredReviewersCount: 2
            requiredCodeownersReviewers: false
            enforceAdmins: true
            requireSignedCommits: true
            requireConversationResolution: false
