---
kind: OrgSettingsClaim
version: '1.0'
name: github_org_settings_secrets
providers:
  github:
    name: firestartr-test-secrets-org-settings
    org: firestartr-test-secrets
    billing_email: billing@example.com
    org_secrets:
      actions:
        - name: MY_SECRET
          value: ref:secretsclaim:secret_a:rds_conn
        - name: ANOTHER_SECRET
          value: ref:secretsclaim:secret_a:rds_conn
      codespaces:
        - name: CODESPACES_SECRET
          value: ref:secretsclaim:secret_a:rds_conn
      dependabot: []
