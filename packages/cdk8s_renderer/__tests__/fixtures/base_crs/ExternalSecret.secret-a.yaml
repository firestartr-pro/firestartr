apiVersion: external-secrets.io/v1alpha1
kind: ExternalSecret
metadata:
  annotations:
    firestartr.dev/claim-ref: SecretsClaim/secret_a
    firestartr.dev/external-name: app-tenant-env
  name: secret-a
spec:
  data:
    - remoteRef:
        key: rds_conn
      secretKey: rds_conn
  refreshInterval: 90d
  secretStoreRef:
    kind: SecretStore
    name: app-tenant-env
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    name: secret-a
    template:
      engineVersion: v2
      metadata:
        data:
          rds_conn: "{{ .rds_conn }}"
