apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  annotations:
    firestartr.dev/claim-ref: SecretsClaim/secret_a
    firestartr.dev/external-name: app-tenant-env
  name: my-postgres-secret-a
spec:
  data:
    - conversionStrategy: None
      match:
        remoteRef:
          remoteKey: my-postgres
        secretKey: password
  deletionPolicy: None
  refreshInterval: 90d
  secretStoreRefs:
    - kind: SecretStore
      name: app-tenant-env
  selector:
    generatorRef:
      apiVersion: external-secrets.io/v1alpha1
      kind: Password
      name: pg-generator
  updatePolicy: Replace
