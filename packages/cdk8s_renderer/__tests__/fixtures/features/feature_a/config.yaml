feature_name: "feature_a"
args:
  NAME:
    $ref:
      - metadata
      - name
  LITERAL:
    $lit: foo
  TECH:
    $ref:
      - spec
      - provisioner
      - technology
      - stack

files:
  - src: test.txt
    dest: test.txt
    user_defined: false
    target_branch: deployment
  - src: .github/workflows/{{| TECH |}}/pr-verify.yaml
    dest: .github/workflows/pr-verify.yaml
    user_defined: false
claimPatches:
  - name: "add_annotation"
    op: "add"
    path: "/annotations/backstage.io~1techdocs-ref"
    value: "url:https://github.com/prefapp/feature_a/tree/main"
