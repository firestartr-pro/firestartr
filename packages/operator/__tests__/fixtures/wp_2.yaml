apiVersion: firestartr.dev/v1
kind: FirestartrTerraformWorkspace
metadata:
  name: s3-test-2-fb79f8fc-5d25-41b1-aadc-0a3189390f95
  annotations:
    firestartr.dev/claim-ref: none
spec:
  firestartr:
    tfStateKey: fb79f8fc-5d25-41b1-aadc-0a3189390f95
  context:
    backend:
      ref:
        kind: FirestartrProviderConfig
        name: backend-tf-workspaces
    provider:
      ref:
        kind: FirestartrProviderConfig
        name: provider-aws-workspaces
  source: Inline
  module: |
    variable "name" {
      type = string
    }

    output "the_another_output" {

      value = "Hola 2, ${var.name}!"

