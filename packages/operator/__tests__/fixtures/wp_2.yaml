    output "the_another_output_2" {

      value = "aaaaa, ${var.name}!"

    }

    output "the_another_output_3" {

      value = "E, ${var.name}!"

    }

    variable "lalalalal" {
      type = string
    }

    resource "aws_s3_bucket" "test-bucket-for-firestartr" {
      bucket        = "test-output-bucket-firestartr-${var.name}-2"
      force_destroy = true
    }
  values: |
    {
      "name": "${{ references.TEST_OUTPUT }}",
      "lalalalal": "lalalalal"
    }
  references:
    - name: TEST_OUTPUT
      ref:
        kind: FirestartrTerraformWorkspace
        name: s3-test-3627b80e-62cc-4c80-977d-2f821e769fbe
        key: testOutput
