# Committed by the repo-secrets e2e test into the disposable generated
# repository. The workflow compares the provisioned repository Actions secret
# with the expected value dispatched by the test; the run's success conclusion
# is the authoritative value assertion. Values travel only through environment
# variables and are never printed.
name: verify-secret

run-name: ${{ inputs.correlation_id }}

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: Repository Actions secret to verify
        required: true
        type: string
      expected_value:
        description: Expected plaintext value of the secret
        required: true
        type: string
      correlation_id:
        description: Unique ID correlating this run with its dispatching test
        required: true
        type: string

jobs:
  verify-secret-value:
    runs-on: ubuntu-latest
    steps:
      - name: Compare provisioned secret with expected value
        env:
          ACTUAL_VALUE: ${{ secrets[inputs.secret_name] }}
          EXPECTED_VALUE: ${{ inputs.expected_value }}
        run: >
          node -e "if (process.env.ACTUAL_VALUE !== process.env.EXPECTED_VALUE)
          { console.error('secret value mismatch'); process.exit(1); }"
