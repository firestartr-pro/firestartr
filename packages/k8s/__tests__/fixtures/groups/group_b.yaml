apiVersion: firestartr.dev/v1
kind: FirestartrGithubGroup
metadata:
  name: group-b
spec:
  org: firestartr-test
  privacy: closed
  description: 'test description'

  members:
    - ref:
        kind: FirestartrGithubMembership
        name: user-h
        needsSecret: false

  firestartr:
    tfStateKey: bbbbbbbb-bbbb-4bbb-bbbb-bbbbbbbbbbbb

  writeConnectionSecretToRef:
    name: firestartrgithubgroup-group-b-outputs
    outputs:
    - key: id
    - key: nodeId
    - key: slug

  context:
    backend:
      ref:
        kind: FirestartrProviderConfig
        name: aws-state-bucket
    provider:
      ref:
        kind: FirestartrProviderConfig
        name: github-app
