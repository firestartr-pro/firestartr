apiVersion: firestartr.dev/v1
kind: FirestartrGithubGroup
metadata:
  name: group-d
spec:
  org: firestartr-test
  privacy: closed
  description: "test description"

  members:
    - ref:
        kind: FirestartrGithubMembership
        name: user-h
        needsSecret: false

  firestartr:
    tfStateKey: daaaaaaa-aaaa-4aaa-aaaa-aaaaaaaaaaaa

  writeConnectionSecretToRef:
    name: firestartrgithubgroup-group-b-outputs
    outputs:
      - key: id
      - key: nodeId
      - key: slug

  context:
    backend:
      ref:
        kind: FirestartrProviderConfig
        name: aws-state-bucket
    provider:
      ref:
        kind: FirestartrProviderConfig
        name: github-app
