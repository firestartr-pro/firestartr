apiVersion: firestartr.dev/v1
kind: FirestartrGithubGroup
metadata:
  name: group-c
spec:
  context:
    backend:
      ref:
        kind: FirestartrProviderConfig
        name: aws-state-bucket
    provider:
      ref:
        kind: FirestartrProviderConfig
        name: github-app
  org: firestartr-test
  privacy: closed
  description: 'test description'

  members:
    - ref:
        kind: FirestartrGithubMembership
        name: user-d
        needsSecret: false

  firestartr:
    tfStateKey: cccccccc-cccc-4ccc-cccc-cccccccccccc

  writeConnectionSecretToRef:
    name: firestartrgithubgroup-group-c-outputs
    outputs:
    - key: id
    - key: nodeId
    - key: slug
