apiVersion: firestartr.dev/v1
kind: FirestartrGithubGroup
metadata:
  name: METADATA_NAME
spec:
  org: firestartr-test
  privacy: closed
  description: "test description"

  writeConnectionSecretToRef:
    name: firestartrgithubgroup-METADATA_NAME-outputs
    outputs:
      - key: id
      - key: nodeId
      - key: slug

  firestartr:
    tfStateKey: UUID_KEY
    catalog:
      - name: firestartr-test
        kind: group
        type: business-unit
        profile:
          displayName: testGroupa
          email: test@test.test

  members:
    - ref:
        kind: FirestartrGithubMembership
        name: user-d
        needsSecret: false
