---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: githuborgwebhooks.firestartr.dev
spec:
  group: firestartr.dev
  scope: Namespaced
  names:
    plural: githuborgwebhooks
    singular: githuborgwebhook
    kind: FirestartrGithubOrgWebhook
    shortNames:
      - ghow
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: "A resource to handle GitHub Organization Webhooks"
          type: object
          properties:
            spec:
              type: object
              properties:
                orgName:
                  type: string
                  description: Organization name on GitHub
                webhook:
                  type: object
                  properties:
                    url:
                      type: string
                      description: Webhook endpoint URL
                    contentType:
                      type: string
                      enum: [json, form]
                      description: Payload content type (json or form)
                    secretRef:
                      type: object
                      description: Secret ref for signing the payload
                      properties:
                        kind:
                          type: string
                          enum:
                            - Secret
                          description: 'The type of Kubernetes resource to reference.'
                        name:
                          type: string
                          description: Secret name
                        key:
                          type: string
                          description: Secret key that contains the webhook secret
                      required:
                        - name
                        - key
                        - kind
                    insecureSsl:
                      type: boolean
                      description: Whether to allow unverified SSL connections (not recommended)
                      default: false
                    active:
                      type: boolean
                      description: If the webhook is active
                      default: true
                    events:
                      type: array
                      items:
                        type: string
                      description: List of events that trigger the webhook (e.g., push, pull_request, issues)
                  required:
                    - url
                    - contentType
                    - events
                    - secretRef
                context:
                  type: object
                  required:
                    - backend
                    - provider
                  properties:
                    backend:
                      type: object
                      required:
                        - ref
                      properties:
                        ref:
                          type: object
                          required:
                            - kind
                            - name
                          properties:
                            kind:
                              type: string
                              enum:
                                - FirestartrProviderConfig
                            name:
                              type: string
                    provider:
                      type: object
                      required:
                        - ref
                      properties:
                        ref:
                          type: object
                          required:
                            - kind
                            - name
                          properties:
                            kind:
                              type: string
                              enum:
                                - FirestartrProviderConfig
                            name:
                              type: string
                firestartr:
                  type: object
                  properties:
                    tfStateKey:
                      type: string
                writeConnectionSecretToRef:
                  type: object
                  properties:
                    name:
                      type: string
                    outputs:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                        required:
                          - key
              required:
                - orgName
                - webhook
                - writeConnectionSecretToRef
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - status
                      - type
                    properties:
                      lastSyncTime:
                        type: string
                        format: date-time
                      nextSyncTime:
                        type: string
                        format: date-time
                      lastTransitionTime:
                        type: string
                        format: date-time
                      lastUpdateTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      type:
                        type: string
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                failedIssuanceAttempts:
                  type: integer
                lastFailureTime:
                  type: string
                  format: date-time
                nextPrivateKeySecretName:
                  type: string
                notAfter:
                  type: string
                  format: date-time
                notBefore:
                  type: string
                  format: date-time
                renewalTime:
                  type: string
                  format: date-time
                retryCount:
                  type: integer
                  description: "Number of retry attempts since last successful operation"
                nextRetryTime:
                  type: string
                  format: date-time
                  description: "Scheduled time for the next retry attempt"
                revision:
                  type: integer
      additionalPrinterColumns:
        - name: STATE
          type: string
          description: Current state of the resource
          jsonPath: .status.conditions[?(@.status=="True")].type
        - name: REASON
          type: string
          description: Reason for the resource's state
          jsonPath: .status.conditions[?(@.status=="True")].reason
        - name: MESSAGE
          type: string
          description: Small description of the reason
          jsonPath: .status.conditions[?(@.status=="True")].message
