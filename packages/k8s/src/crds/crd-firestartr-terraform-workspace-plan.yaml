---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: terraformworkspaceplans.firestartr.dev
spec:
  group: firestartr.dev
  names:
    kind: FirestartrTerraformWorkspacePlan
    plural: terraformworkspaceplans
    singular: terraformworkspaceplan
    shortNames:
      - tfwpl
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: "A workspace to handle Terraform code"
          type: object
          required:
            - metadata
            - spec
          properties:
            spec:
              type: object
              properties:
                context:
                  type: object
                  required:
                    - backend
                    - providers
                  properties:
                    backend:
                      type: object
                      required:
                        - ref
                      properties:
                        ref:
                          type: object
                          required:
                            - kind
                            - name
                          properties:
                            kind:
                              type: string
                              enum:
                                - FirestartrProviderConfig
                            name:
                              type: string
                    providers:
                      type: array
                      items:
                        type: object
                        required:
                          - ref
                        properties:
                          ref:
                            type: object
                            required:
                              - kind
                              - name
                            properties:
                              kind:
                                type: string
                                enum:
                                  - FirestartrProviderConfig
                              name:
                                type: string
                firestartr:
                  type: object
                  properties:
                    tfStateKey:
                      type: string
                  required:
                    - tfStateKey
                module:
                  type: string
                source:
                  type: string
                  enum:
                    - Remote
                    - Inline
                values:
                  type: string
                references:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      ref:
                        type: object
                        required:
                          - kind
                          - name
                          - key
                        properties:
                          kind:
                            type: string
                            enum:
                              - FirestartrTerraformWorkspace
                              - ExternalSecret
                          name:
                            type: string
                          key:
                            type: string
                writeConnectionSecretToRef:
                  type: object
                  properties:
                    name:
                      type: string
                    outputs:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                        required:
                          - key
                  required:
                    - name
                    - outputs
              required:
                - firestartr
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      lastUpdateTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      type:
                        type: string
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                failedIssuanceAttempts:
                  type: integer
                lastFailureTime:
                  type: string
                  format: date-time
                nextPrivateKeySecretName:
                  type: string
                notAfter:
                  type: string
                  format: date-time
                notBefore:
                  type: string
                  format: date-time
                renewalTime:
                  type: string
                  format: date-time
                retryCount:
                  type: integer
                  description: "Number of retry attempts since last successful operation"
                nextRetryTime:
                  type: string
                  format: date-time
                  description: "Scheduled time for the next retry attempt"
                revision:
                  type: integer
      additionalPrinterColumns:
        - name: STATE
          type: string
          description: Current state of the resource
          jsonPath: .status.conditions[?(@.status=="True")].type
        - name: REASON
          type: string
          description: Reason for the resource's state
          jsonPath: .status.conditions[?(@.status=="True")].reason
