---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: githuborganizationvariablesections.firestartr.dev
spec:
  group: firestartr.dev
  names:
    kind: FirestartrGithubOrganizationVariableSection
    plural: githuborganizationvariablesections
    singular: githuborganizationvariablesection
    shortNames:
      - ghorgvars
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: "A resource to handle GitHub Organization Actions Variables."
          type: object
          required:
            - metadata
            - spec
          properties:
            metadata:
              type: object
            spec:
              type: object
              properties:
                org:
                  type: string
                  description: GitHub organization targeted by this resource
                actionsVariables:
                  type: array
                  description: GitHub Actions organization-level variables
                  items:
                    type: object
                    required:
                      - name
                      - value
                      - visibility
                    properties:
                      name:
                        type: string
                        description: Variable name matching GitHub Actions naming rules
                      value:
                        type: string
                        description: Variable value
                      visibility:
                        type: string
                        description: Visibility of the variable
                        enum:
                          - all
                          - private
                          - selected
                      selectedRepositories:
                        type: array
                        description: Repository names in org/repo format
                        items:
                          type: string
                context:
                  type: object
                  required:
                    - backend
                    - provider
                  properties:
                    backend:
                      type: object
                      required:
                        - ref
                      properties:
                        ref:
                          type: object
                          required:
                            - kind
                            - name
                          properties:
                            kind:
                              type: string
                              enum:
                                - FirestartrProviderConfig
                            name:
                              type: string
                    provider:
                      type: object
                      required:
                        - ref
                      properties:
                        ref:
                          type: object
                          required:
                            - kind
                            - name
                          properties:
                            kind:
                              type: string
                              enum:
                                - FirestartrProviderConfig
                            name:
                              type: string
                firestartr:
                  type: object
                  properties:
                    tfStateKey:
                      type: string
                  required:
                    - tfStateKey
                writeConnectionSecretToRef:
                  type: object
                  properties:
                    name:
                      type: string
                    outputs:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                        required:
                          - key
                  required:
                    - name
                    - outputs
              required:
                - org
                - context
                - firestartr
                - writeConnectionSecretToRef
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - status
                      - type
                    properties:
                      lastSyncTime:
                        type: string
                        format: date-time
                      nextSyncTime:
                        type: string
                        format: date-time
                      lastTransitionTime:
                        type: string
                        format: date-time
                      lastUpdateTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      type:
                        type: string
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                retryCount:
                  type: integer
                  description: "Number of retry attempts since last successful operation"
                nextRetryTime:
                  type: string
                  format: date-time
                  description: "Scheduled time for the next retry attempt"
                revision:
                  type: integer
      additionalPrinterColumns:
        - name: STATE
          type: string
          description: Current state of the resource
          jsonPath: .status.conditions[?(@.status=="True")].type
        - name: REASON
          type: string
          description: Reason for the resource's state
          jsonPath: .status.conditions[?(@.status=="True")].reason
        - name: MESSAGE
          type: string
          description: Small description of the reason
          jsonPath: .status.conditions[?(@.status=="True")].message
