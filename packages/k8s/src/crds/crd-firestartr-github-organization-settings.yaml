---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: githuborganizationsettings.firestartr.dev
spec:
  group: firestartr.dev
  names:
    kind: FirestartrGithubOrganizationSettings
    plural: githuborganizationsettings
    singular: githuborganizationsetting
    shortNames:
      - ghorgsettings
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: "A resource to handle GitHub Organization Settings."
          type: object
          required:
            - metadata
            - spec
          properties:
            metadata:
              type: object
            spec:
              type: object
              properties:
                org:
                  type: string
                  description: GitHub organization targeted by this resource
                billingEmail:
                  type: string
                  description: Billing email for the GitHub organization
                company:
                  type: string
                  description: Company name for the GitHub organization
                blog:
                  type: string
                  description: Blog URL for the GitHub organization
                email:
                  type: string
                  description: Public email for the GitHub organization
                twitterUsername:
                  type: string
                  description: Twitter username for the GitHub organization
                location:
                  type: string
                  description: Location of the GitHub organization
                name:
                  type: string
                  description: Display name of the GitHub organization
                description:
                  type: string
                  description: Description of the GitHub organization
                hasOrganizationProjects:
                  type: boolean
                  description: Whether organization projects are enabled
                  default: true
                hasRepositoryProjects:
                  type: boolean
                  description: Whether repository projects are enabled
                  default: true
                defaultRepositoryPermission:
                  type: string
                  description: Default repository permission for organization members
                  enum:
                    - read
                    - write
                    - admin
                    - none
                  default: read
                membersCanCreateRepositories:
                  type: boolean
                  description: Whether members can create repositories
                  default: true
                membersCanCreatePublicRepositories:
                  type: boolean
                  description: Whether members can create public repositories
                  default: true
                membersCanCreatePrivateRepositories:
                  type: boolean
                  description: Whether members can create private repositories
                  default: true
                membersCanCreateInternalRepositories:
                  type: boolean
                  description: Whether members can create internal repositories
                membersCanCreatePages:
                  type: boolean
                  description: Whether members can create GitHub Pages
                  default: true
                membersCanCreatePublicPages:
                  type: boolean
                  description: Whether members can create public GitHub Pages
                  default: true
                membersCanCreatePrivatePages:
                  type: boolean
                  description: Whether members can create private GitHub Pages
                  default: true
                membersCanForkPrivateRepositories:
                  type: boolean
                  description: Whether members can fork private repositories
                  default: false
                webCommitSignoffRequired:
                  type: boolean
                  description: Whether web commit signoff is required
                  default: false
                advancedSecurityEnabledForNewRepositories:
                  type: boolean
                  description: Whether advanced security is enabled for new repositories
                  default: false
                dependabotAlertsEnabledForNewRepositories:
                  type: boolean
                  description: Whether Dependabot alerts are enabled for new repositories
                  default: false
                dependabotSecurityUpdatesEnabledForNewRepositories:
                  type: boolean
                  description: Whether Dependabot security updates are enabled for new repositories
                  default: false
                dependencyGraphEnabledForNewRepositories:
                  type: boolean
                  description: Whether dependency graph is enabled for new repositories
                  default: false
                secretScanningEnabledForNewRepositories:
                  type: boolean
                  description: Whether secret scanning is enabled for new repositories
                  default: false
                secretScanningPushProtectionEnabledForNewRepositories:
                  type: boolean
                  description: Whether secret scanning push protection is enabled for new repositories
                  default: false
                context:
                  type: object
                  required:
                    - backend
                    - provider
                  properties:
                    backend:
                      type: object
                      required:
                        - ref
                      properties:
                        ref:
                          type: object
                          required:
                            - kind
                            - name
                          properties:
                            kind:
                              type: string
                              enum:
                                - FirestartrProviderConfig
                            name:
                              type: string
                    provider:
                      type: object
                      required:
                        - ref
                      properties:
                        ref:
                          type: object
                          required:
                            - kind
                            - name
                          properties:
                            kind:
                              type: string
                              enum:
                                - FirestartrProviderConfig
                            name:
                              type: string
                firestartr:
                  type: object
                  properties:
                    tfStateKey:
                      type: string
                  required:
                    - tfStateKey
                writeConnectionSecretToRef:
                  type: object
                  properties:
                    name:
                      type: string
                    outputs:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                        required:
                          - key
                  required:
                    - name
                    - outputs
              required:
                - org
                - billingEmail
                - context
                - firestartr
                - writeConnectionSecretToRef
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - status
                      - type
                    properties:
                      lastSyncTime:
                        type: string
                        format: date-time
                      nextSyncTime:
                        type: string
                        format: date-time
                      lastTransitionTime:
                        type: string
                        format: date-time
                      lastUpdateTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      type:
                        type: string
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                failedIssuanceAttempts:
                  type: integer
                lastFailureTime:
                  type: string
                  format: date-time
                nextPrivateKeySecretName:
                  type: string
                notAfter:
                  type: string
                  format: date-time
                notBefore:
                  type: string
                  format: date-time
                renewalTime:
                  type: string
                  format: date-time
                retryCount:
                  type: integer
                  description: "Number of retry attempts since last successful operation"
                nextRetryTime:
                  type: string
                  format: date-time
                  description: "Scheduled time for the next retry attempt"
                revision:
                  type: integer
      additionalPrinterColumns:
        - name: STATE
          type: string
          description: Current state of the resource
          jsonPath: .status.conditions[?(@.status=="True")].type
        - name: REASON
          type: string
          description: Reason for the resource's state
          jsonPath: .status.conditions[?(@.status=="True")].reason
        - name: MESSAGE
          type: string
          description: Small description of the reason
          jsonPath: .status.conditions[?(@.status=="True")].message
