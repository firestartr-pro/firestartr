---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: githubgroups.firestartr.dev
spec:
  group: firestartr.dev
  names:
    kind: FirestartrGithubGroup
    plural: githubgroups
    singular: githubgroup
    shortNames:
      - ghgroup
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: "A resource to handle GitHub groups"
          type: object
          properties:
            spec:
              type: object
              properties:
                org:
                  type: string
                privacy:
                  type: string
                  enum:
                    - closed
                    - secret
                description:
                  type: string
                parentTeam:
                  type: object
                  properties:
                    ref:
                      type: object
                      properties:
                        kind:
                          type: string
                        name:
                          type: string
                        needsSecret:
                          type: boolean
                      required:
                        - kind
                        - name
                        - needsSecret
                  required:
                    - ref
                members:
                  type: array
                  items:
                    type: object
                    properties:
                      ref:
                        type: object
                        properties:
                          kind:
                            type: string
                          name:
                            type: string
                          needsSecret:
                            type: boolean
                        required:
                          - kind
                          - name
                          - needsSecret
                    required:
                      - ref
                context:
                  type: object
                  required:
                    - backend
                    - provider
                  properties:
                    backend:
                      type: object
                      required:
                        - ref
                      properties:
                        ref:
                          type: object
                          required:
                            - kind
                            - name
                          properties:
                            kind:
                              type: string
                              enum:
                                - FirestartrProviderConfig
                            name:
                              type: string
                    provider:
                      type: object
                      required:
                        - ref
                      properties:
                        ref:
                          type: object
                          required:
                            - kind
                            - name
                          properties:
                            kind:
                              type: string
                              enum:
                                - FirestartrProviderConfig
                            name:
                              type: string
                firestartr:
                  type: object
                  properties:
                    tfStateKey:
                      type: string
                writeConnectionSecretToRef:
                  type: object
                  properties:
                    name:
                      type: string
                    outputs:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                        required:
                          - key
              required:
                - org
                - privacy
                - members
                - context
                - firestartr
                - writeConnectionSecretToRef
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - status
                      - type
                    properties:
                      lastSyncTime:
                        type: string
                        format: date-time
                      nextSyncTime:
                        type: string
                        format: date-time
                      lastTransitionTime:
                        type: string
                        format: date-time
                      lastUpdateTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      type:
                        type: string
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                failedIssuanceAttempts:
                  type: integer
                lastFailureTime:
                  type: string
                  format: date-time
                nextPrivateKeySecretName:
                  type: string
                notAfter:
                  type: string
                  format: date-time
                notBefore:
                  type: string
                  format: date-time
                renewalTime:
                  type: string
                  format: date-time
                retryCount:
                  type: integer
                  description: "Number of retry attempts since last successful operation"
                nextRetryTime:
                  type: string
                  format: date-time
                  description: "Scheduled time for the next retry attempt"
                revision:
                  type: integer
      additionalPrinterColumns:
        - name: STATE
          type: string
          description: Current state of the resource
          jsonPath: .status.conditions[?(@.status=="True")].type
        - name: REASON
          type: string
          description: Reason for the resource's state
          jsonPath: .status.conditions[?(@.status=="True")].reason
        - name: MESSAGE
          type: string
          description: Small description of the reason
          jsonPath: .status.conditions[?(@.status=="True")].message
