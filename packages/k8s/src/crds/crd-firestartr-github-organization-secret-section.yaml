---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: githuborganizationsecretsections.firestartr.dev
spec:
  group: firestartr.dev
  names:
    kind: FirestartrGithubOrganizationSecretSection
    plural: githuborganizationsecretsections
    singular: githuborganizationsecretsection
    shortNames:
      - ghorgsecrets
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: "A resource to handle GitHub Organization Actions Secrets."
          type: object
          required:
            - metadata
            - spec
          properties:
            metadata:
              type: object
            spec:
              type: object
              properties:
                org:
                  type: string
                  description: GitHub organization targeted by this resource
                secrets:
                  type: object
                  description: 'A map of secret types, each containing a list of secrets.'
                  properties:
                    actions:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            description: 'The name of the secret.'
                          ref:
                            description: 'A reference to the Kubernetes Secret resource that contains the value.'
                            type: object
                            properties:
                              kind:
                                type: string
                                enum:
                                  - Secret
                                description: 'The type of Kubernetes resource to reference.'
                              name:
                                type: string
                                description: 'The name of the Kubernetes Secret resource.'
                              key:
                                type: string
                                description: 'The key within the Kubernetes Secret data.'
                            required:
                              - kind
                              - name
                              - key
                          visibility:
                            type: string
                            enum:
                              - all
                              - selected
                              - private
                            description: 'Which repositories can access the secret.'
                            default: all
                          selectedRepositories:
                            type: array
                            items:
                              type: string
                            description: 'List of repository names when visibility is selected.'
                        required:
                          - name
                          - ref
                    codespaces:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            description: 'The name of the secret.'
                          ref:
                            description: 'A reference to the Kubernetes Secret resource that contains the value.'
                            type: object
                            properties:
                              kind:
                                type: string
                                enum:
                                  - Secret
                                description: 'The type of Kubernetes resource to reference.'
                              name:
                                type: string
                                description: 'The name of the Kubernetes Secret resource.'
                              key:
                                type: string
                                description: 'The key within the Kubernetes Secret data.'
                            required:
                              - kind
                              - name
                              - key
                          visibility:
                            type: string
                            enum:
                              - all
                              - selected
                              - private
                            description: 'Which repositories can access the secret.'
                            default: all
                          selectedRepositories:
                            type: array
                            items:
                              type: string
                            description: 'List of repository names when visibility is selected.'
                        required:
                          - name
                          - ref
                    dependabot:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            description: 'The name of the secret.'
                          ref:
                            description: 'A reference to the Kubernetes Secret resource that contains the value.'
                            type: object
                            properties:
                              kind:
                                type: string
                                enum:
                                  - Secret
                                description: 'The type of Kubernetes resource to reference.'
                              name:
                                type: string
                                description: 'The name of the Kubernetes Secret resource.'
                              key:
                                type: string
                                description: 'The key within the Kubernetes Secret data.'
                            required:
                              - kind
                              - name
                              - key
                          visibility:
                            type: string
                            enum:
                              - all
                              - selected
                              - private
                            description: 'Which repositories can access the secret.'
                            default: all
                          selectedRepositories:
                            type: array
                            items:
                              type: string
                            description: 'List of repository names when visibility is selected.'
                        required:
                          - name
                          - ref
                context:
                  type: object
                  required:
                    - backend
                    - provider
                  properties:
                    backend:
                      type: object
                      required:
                        - ref
                      properties:
                        ref:
                          type: object
                          required:
                            - kind
                            - name
                          properties:
                            kind:
                              type: string
                              enum:
                                - FirestartrProviderConfig
                            name:
                              type: string
                    provider:
                      type: object
                      required:
                        - ref
                      properties:
                        ref:
                          type: object
                          required:
                            - kind
                            - name
                          properties:
                            kind:
                              type: string
                              enum:
                                - FirestartrProviderConfig
                            name:
                              type: string
                firestartr:
                  type: object
                  properties:
                    tfStateKey:
                      type: string
                  required:
                    - tfStateKey
                writeConnectionSecretToRef:
                  type: object
                  properties:
                    name:
                      type: string
                    outputs:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                        required:
                          - key
                  required:
                    - name
                    - outputs
              required:
                - org
                - secrets
                - context
                - firestartr
                - writeConnectionSecretToRef
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - status
                      - type
                    properties:
                      lastSyncTime:
                        type: string
                        format: date-time
                      nextSyncTime:
                        type: string
                        format: date-time
                      lastTransitionTime:
                        type: string
                        format: date-time
                      lastUpdateTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      type:
                        type: string
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                syncedSecrets:
                  description: 'A list of secrets that have been successfully synchronized.'
                  type: array
                  items:
                    type: string
                retryCount:
                  type: integer
                  description: "Number of retry attempts since last successful operation"
                nextRetryTime:
                  type: string
                  format: date-time
                  description: "Scheduled time for the next retry attempt"
                revision:
                  type: integer
      additionalPrinterColumns:
        - name: STATE
          type: string
          description: Current state of the resource
          jsonPath: .status.conditions[?(@.status=="True")].type
        - name: REASON
          type: string
          description: Reason for the resource's state
          jsonPath: .status.conditions[?(@.status=="True")].reason
        - name: MESSAGE
          type: string
          description: Small description of the reason
          jsonPath: .status.conditions[?(@.status=="True")].message
