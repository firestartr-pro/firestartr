---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: terraformworkspaces.firestartr.dev
spec:
  group: firestartr.dev
  names:
    kind: FirestartrTerraformWorkspace
    plural: terraformworkspaces
    singular: terraformworkspace
    shortNames:
      - tfwp
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: "A workspace to handle Terraform code"
          type: object
          required:
            - metadata
            - spec
          properties:
            spec:
              type: object
              properties:
                context:
                  type: object
                  required:
                    - backend
                    - providers
                  properties:
                    backend:
                      type: object
                      required:
                        - ref
                      properties:
                        ref:
                          type: object
                          required:
                            - kind
                            - name
                          properties:
                            kind:
                              type: string
                              enum:
                                - FirestartrProviderConfig
                            name:
                              type: string
                    providers:
                      type: array
                      items:
                        type: object
                        required:
                          - ref
                        properties:
                          ref:
                            type: object
                            required:
                              - kind
                              - name
                            properties:
                              kind:
                                type: string
                                enum:
                                  - FirestartrProviderConfig
                              name:
                                type: string
                firestartr:
                  type: object
                  properties:
                    tfStateKey:
                      type: string
                  required:
                    - tfStateKey
                module:
                  type: string
                source:
                  type: string
                  enum:
                    - Remote
                    - Inline
                values:
                  type: string
                files: # <--- New property
                  type: array
                  description: 'A list of files to be created in the Terraform workspace directory.'
                  default: [] 
                  items:
                    type: object
                    required:
                      - content
                      - path
                    properties:
                      content:
                        type: string
                        description: 'The base64 encoded content of the file.'
                      path:
                        type: string
                        description: 'The target relative path for the file within the Terraform workspace directory.'
                references:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      ref:
                        type: object
                        required:
                          - kind
                          - name
                          - key
                        properties:
                          kind:
                            type: string
                            enum:
                              - FirestartrTerraformWorkspace
                              - ExternalSecret
                              - Secret
                          name:
                            type: string
                          key:
                            type: string
                writeConnectionSecretToRef:
                  type: object
                  properties:
                    name:
                      type: string
                    outputs:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                        required:
                          - key
                  required:
                    - name
                    - outputs
              required:
                - firestartr
            status:
              type: object
              properties:
                highPriorityState:
                  type: string
                  description: The single, highest-priority status type (e.g., ERROR, OUT_OF_SYNC).
                highPriorityReason:
                  type: string
                  description: The reason corresponding to the high-priority state.
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      lastSyncTime:
                        type: string
                        format: date-time
                      nextSyncTime:
                        type: string
                        format: date-time
                      lastUpdateTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      type:
                        type: string
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                failedIssuanceAttempts:
                  type: integer
                lastFailureTime:
                  type: string
                  format: date-time
                nextPrivateKeySecretName:
                  type: string
                notAfter:
                  type: string
                  format: date-time
                notBefore:
                  type: string
                  format: date-time
                renewalTime:
                  type: string
                  format: date-time
                retryCount:
                  type: integer
                  description: "Number of retry attempts since last successful operation"
                nextRetryTime:
                  type: string
                  format: date-time
                  description: "Scheduled time for the next retry attempt"
                revision:
                  type: integer
      additionalPrinterColumns:
        - name: STATE
          type: string
          jsonPath: .status.highPriorityState
          description: "Current state of the resource (Prioritized: PROVISIONING > ERROR > OUT_OF_SYNC > PLANNING > DELETING > SYNCHRONIZED > PROVISIONED > DELETED)."
        - name: REASON
          type: string
          jsonPath: .status.highPriorityReason
          description: "Reason for the resource state."
