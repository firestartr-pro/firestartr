apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fsdummiesb.firestartr.dev
spec:
  group: firestartr.dev
  scope: Namespaced
  names:
    plural: fsdummiesb
    singular: fsdummyb
    kind: FirestartrDummyB
    shortNames: ["fsdb"]
  
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {} # Enables the /status subresource endpoint
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              description: The desired state of the FirestartrDummyB resource.
              properties:
                needs:
                  type: object
                  description: dependency of another object
                  properties:
                    name:
                      type: string
                      description: the dummy this dummy depends on
                    kind:
                      type: string
                      description: the kind of this dummy
                      default: "FirestartrDummyA"
                  required: ["name"]
                computation:
                  type: object
                  description: Settings for the dummy computation delay.
                  properties:
                    numberOfSeconds:
                      type: integer
                      description: The number of seconds the dummy computation should run.
                      minimum: 1
                      default: 5 # Default ensures field is always present
                    numberOfSecondsToDestroy:
                      type: integer
                      description: The number of seconds the dummy computation should run in order to be destroyed.
                      minimum: 1
                      default: 10 # Default ensures field is always present
                  required: ["numberOfSeconds"]
              required: ["computation"]
            status:
              type: object
              properties:
                highPriorityState:
                  type: string
                  description: The single, highest-priority status type (e.g., ERROR, OUT_OF_SYNC).
                highPriorityReason:
                  type: string
                  description: The reason corresponding to the high-priority state.
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - status
                      - type
                    properties:
                      lastSyncTime:
                        type: string
                        format: date-time
                      nextSyncTime:
                        type: string
                        format: date-time
                      lastTransitionTime:
                        type: string
                        format: date-time
                      lastUpdateTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      type:
                        type: string
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                failedIssuanceAttempts:
                  type: integer
                lastFailureTime:
                  type: string
                  format: date-time
                nextPrivateKeySecretName:
                  type: string
                notAfter:
                  type: string
                  format: date-time
                notBefore:
                  type: string
                  format: date-time
                renewalTime:
                  type: string
                  format: date-time
                revision:
                  type: integer
      additionalPrinterColumns:
        - name: STATE
          type: string
          jsonPath: .status.highPriorityState
          description: "Current state of the resource (Prioritized: PROVISIONING > ERROR > OUT_OF_SYNC > PLANNING > DELETING > SYNCHRONIZED > PROVISIONED > DELETED)."
        - name: REASON
          type: string
          jsonPath: .status.highPriorityReason
          description: "Reason for the resource state."

